<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cookiebot – YouTube inline test</title>

  <!-- Cookiebot (USA UM CBID TEU, COM ESTE DOMÍNIO CONFIGURADO) -->
  <script
    id="Cookiebot"
    src="https://consent.cookiebot.com/uc.js"
    data-cbid="YOUR_CBID_HERE"
    data-blockingmode="auto"
    type="text/javascript">
  </script>

  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 3rem;
      line-height: 1.4;
    }

    iframe {
      width: 100%;
      max-width: 960px;
      aspect-ratio: 16 / 9;
      border: 0;
      background: #000;
      display: block;
    }

    .box {
      max-width: 960px;
    }

    .debug {
      background: #f7f7f7;
      border-radius: 8px;
      padding: 12px;
      margin-top: 16px;
      white-space: pre-wrap;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <h2>YouTube inline – Cookiebot scan test</h2>

  <div class="box">

    <!-- OPT-OUT (SEM MARKETING CONSENT) -->
    <div class="cookieconsent-optout-marketing">
      <div style="padding:16px; border:1px solid #ddd; border-radius:8px;">
        Por favor
        <a href="javascript:Cookiebot.renew()">
          acepta las cookies de marketing
        </a>
        para ver el video.
      </div>
    </div>

    <!-- OPT-IN (INLINE, SEM MODAL) -->
    <div class="cookieconsent-optin-marketing" style="margin-top:16px;">
      <iframe
        title="YouTube inline test"
        data-cookieblock-src="https://www.youtube.com/embed/Z7_r9g7pM7o?rel=0"
        data-cookieconsent="marketing"
        allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen>
      </iframe>
    </div>

    <!-- DEBUG -->
    <div class="debug" id="dbg">loading…</div>

  </div>

  <script>
    function dbg() {
      const iframe = document.querySelector("iframe");
      const src = iframe ? (iframe.getAttribute("src") || "(empty)") : "(no iframe)";
      const cb = !!window.Cookiebot;
      const consent = cb && Cookiebot.consent ? Cookiebot.consent.marketing : false;

      document.getElementById("dbg").textContent =
        "Cookiebot present: " + cb + "\n" +
        "marketing consent: " + consent + "\n" +
        "iframe src: " + src + "\n";
    }

    window.addEventListener("CookiebotOnLoad", dbg);
    window.addEventListener("CookiebotOnAccept", dbg);
    setTimeout(dbg, 1000);
  </script>

</body>
</html>
