<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>No blocking — all embeds load normally</title>

  <!-- Cookiebot -->
  <script id="Cookiebot"
          src="https://consent.cookiebot.com/uc.js"
          data-cbid="e2769309-3672-42d4-bc3f-d56333e6a880"
          data-blockingmode="auto"
          type="text/javascript"></script>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    body { padding: 2rem; font-family: system-ui, -apple-system, sans-serif; }
    .hint { color:#666; font-size: 14px; }
  </style>
</head>

<body>
  <h2>No blocking — all embeds load normally</h2>
  <p class="hint">
    Sem qualquer bloqueio Cookiebot. Todos os embeds carregam directamente com <code>src</code> normal.<br/>
    Versão de referência para comparar com a implementação correcta.
  </p>

  <!-- ===================== YOUTUBE ===================== -->
  <h4 class="mt-4">YouTube</h4>
  <iframe
    title="youtube-player"
    width="560"
    height="315"
    src="https://www.youtube.com/embed/Z7_r9g7pM7o?rel=0"
    allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
    allowfullscreen>
  </iframe>

  <!-- ===================== VIMEO ===================== -->
  <h4 class="mt-4">Vimeo</h4>
  <iframe
    title="vimeo-player"
    width="560"
    height="315"
    src="https://player.vimeo.com/video/1072636602?h=7deba18f37">
  </iframe>

  <!-- ===================== SOUNDCLOUD ===================== -->
  <h4 class="mt-4">SoundCloud</h4>
  <iframe
    title="soundcloud-player"
    width="100%"
    height="100"
    src="https://w.soundcloud.com/player/?url=https%3A//api.soundcloud.com/tracks/596141910&color=%23ff5500&auto_play=false&hide_related=false&show_comments=true&show_user=true&show_reposts=false&show_teaser=true&visual=true">
  </iframe>

  <!-- ===================== TYPEFORM ===================== -->
  <h4 class="mt-4">Typeform</h4>
  <div class="typeform-widget" data-url="https://form.typeform.com/to/p7FXyhZk" style="width: 100%; height: 500px;">&nbsp;</div>
  <script>
    (function() {
      var qs,js,q,s,d=document, gi=d.getElementById, ce=d.createElement, gt=d.getElementsByTagName,
      id="typef_orm", b="https://embed.typeform.com/";
      if(!gi.call(d,id)) {
        js=ce.call(d,"script");
        js.id=id;
        js.src=b+"embed.js";
        q=gt.call(d,"script")[0];
        q.parentNode.insertBefore(js,q)
      }
    })()
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
