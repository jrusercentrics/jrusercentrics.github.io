<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>YouTube modal test (reliable)</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { padding: 2rem; }
    iframe { width: 100%; aspect-ratio: 16 / 9; border: 0; background: #000; }
    pre { background:#f7f7f7; padding:12px; border-radius:8px; }
  </style>
</head>

<body>
  <h3>YouTube embed test</h3>
  <p>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#m">
      Open modal
    </button>
  </p>

  <div class="modal fade" id="m" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-xl modal-dialog-centered">
      <div class="modal-content">

        <div class="modal-header">
          <h5 class="modal-title">Video</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>

        <div class="modal-body">
          <div class="d-flex gap-2 mb-3">
            <button id="load" class="btn btn-success">Carregar vídeo</button>
            <button id="unload" class="btn btn-outline-secondary">Limpar</button>
          </div>

          <iframe
            id="yt"
            title="yt"
            allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen>
          </iframe>

          <hr />
          <strong>Debug</strong>
          <pre id="dbg">loading...</pre>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const YT_SRC = "https://www.youtube.com/embed/Z7_r9g7pM7o?rel=0";

    const iframe = document.getElementById("yt");
    const dbg = document.getElementById("dbg");

    function update() {
      dbg.textContent =
        "iframe.src = " + (iframe.getAttribute("src") || "(empty)") + "\n" +
        "iframe.clientHeight = " + iframe.clientHeight + "\n" +
        "modal open = " + document.body.classList.contains("modal-open");
    }

    document.getElementById("load").addEventListener("click", () => {
      iframe.setAttribute("src", YT_SRC);
      update();
    });

    document.getElementById("unload").addEventListener("click", () => {
      iframe.setAttribute("src", "");
      update();
    });

    document.getElementById("m").addEventListener("shown.bs.modal", update);
    document.getElementById("m").addEventListener("hidden.bs.modal", () => {
      iframe.setAttribute("src", "");
      update();
    });

    setTimeout(update, 500);
  </script>
</body>
</html>
